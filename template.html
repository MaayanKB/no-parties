<script>
  try {
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    var type = nav ? nav.type : 'navigate';
    var wanted = type === 'reload' || (type === 'navigate' && !localStorage.getItem('party-deletion-seen'));
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('motion');
      if (wanted) document.documentElement.classList.add('intro-anim');
    }
  } catch (e) { /* no storage: skip the sequence */ }
  try {
    var savedTheme = JSON.parse(localStorage.getItem('party-deletion-theme'));
    var hour = new Date().getHours();
    document.documentElement.dataset.theme = savedTheme || (hour >= 7 && hour < 19 ? 'light' : 'dark');
  } catch (e) {
    var h = new Date().getHours();
    document.documentElement.dataset.theme = h >= 7 && h < 19 ? 'light' : 'dark';
  }
</script>

<style>
  /* Fonts are hosted with the page (no third-party requests): Rubik for text, Karantina for the title. */
  @font-face { font-family: "Rubik"; src: url("fonts/Rubik-Variable.ttf") format("truetype"); font-weight: 300 900; font-display: swap; }
  @font-face { font-family: "Karantina"; src: url("fonts/Karantina-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Playpen"; src: url("fonts/PlaypenSansHebrew-Title.ttf") format("truetype"); font-weight: 300; font-display: swap; }

  /* Palette: Israeli flag blue and white, protest-marker yellow as the only accent.
     Every pair meets WCAG AA or better; nothing relies on color alone (icons and words carry state). */
  :root {
    --bg: #F7F8FC; --card: #FFFFFF; --line: #DCE2EE; --ink: #0B1B3A; --muted: #4A5670;
    --accent: #0038B8; --on-accent: #FFFFFF; --marker: #FFC72C; --on-marker: #0B1B3A;
    --highlight: #FFFBEA; --error: #B3261E; --error-bg: #FDECEA; --fine: #646D83; --logo-loop: #0038B8; --sky: #DCEEFB; --dots: #0038B8; --letter-tab: #FFC72C; --on-letter-tab: #0B1B3A; --band: linear-gradient(180deg, #DCEEFB 0%, #DCEEFB 50%, #F7F8FC 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1630; --card: #13224A; --line: #2A3B66; --ink: #EEF2FF; --muted: #AAB4CC;
      --accent: #8FB0FF; --on-accent: #0B1630; --highlight: #2E2A12; --error: #FF9A8F; --error-bg: #3A1A24; --fine: #77829E; --sky: #1B3358; --dots: #FFC72C; --letter-tab: #FFC72C; --on-letter-tab: #0B1B3A; --band: linear-gradient(180deg, #24427A 0%, #13224A 50%, #0B1630 100%); --logo-loop: #FFC72C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1630; --card: #13224A; --line: #2A3B66; --ink: #EEF2FF; --muted: #AAB4CC;
    --accent: #8FB0FF; --on-accent: #0B1630; --highlight: #2E2A12; --error: #FF9A8F; --error-bg: #3A1A24; --fine: #77829E; --sky: #1B3358; --dots: #FFC72C; --letter-tab: #FFC72C; --on-letter-tab: #0B1B3A; --band: linear-gradient(180deg, #24427A 0%, #13224A 50%, #0B1630 100%); --logo-loop: #FFC72C;
  }

  /* Type scale on the 8px grid: the title, 18/28 opening text, 20/28 section titles, 16/24 everything else. */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* components below set display; hidden must still win */
  /* Smooth motion everywhere; everything instant for people who ask their device for less motion. */
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
    .lang-menu:not([hidden]) { animation: drop .2s cubic-bezier(.2, .8, .2, 1); }
    .toast:not([hidden]) { animation: slide-up .3s cubic-bezier(.2, .8, .2, 1); }
    button, a.btn, .linkish, input[type=text], .logo { transition: background-color .2s ease, border-color .2s ease, color .2s ease, transform .15s ease; }
    button:active, a.btn:active { transform: scale(.97); }
  }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px); } }
  @keyframes slide-up { from { opacity: 0; transform: translateY(16px); } }
  /* The stamp animation briefly scales the sticker past the screen edge; never let that scroll the page sideways. */
  html, body { overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  /* The header sits on a sky-blue band (the polling-booth colour) that scrolls with the page, with faint
     marker-yellow print dots in its top corner. The explanation card overlaps the band's lower edge. */
  .hero { position: relative; isolation: isolate; padding-bottom: 16px; }
  .hero::before, .hero::after { content: ""; position: absolute; z-index: -1; top: -16px; bottom: 0; left: 50%;
                                width: 100vw; transform: translateX(-50%); pointer-events: none; }
  .hero::before { background: var(--band); bottom: -96px; }
  .hero::after { opacity: .35; background-image: radial-gradient(circle, var(--dots) 1.2px, transparent 1.6px); background-size: 16px 16px;
                 -webkit-mask-image: radial-gradient(70% 45% at 100% 0%, #000, transparent 70%);
                 mask-image: radial-gradient(70% 45% at 100% 0%, #000, transparent 70%); }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/24px "Rubik", system-ui, -apple-system, "Segoe UI", "Noto Sans Ethiopic", Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 64px; }
  h1 { margin: 64px 0 24px; font-weight: 400; }
  h1 .tq { display: block; font-family: "Playpen", "Rubik", system-ui, sans-serif; font-weight: 300; font-size: 40px; line-height: 48px; color: var(--accent); }
  h1 .ta { display: block; font-family: "Karantina", "Rubik", system-ui, sans-serif; font-weight: 700; font-size: 112px; line-height: 104px; margin-top: 24px; white-space: nowrap; }
  h2 { font-size: 20px; line-height: 28px; margin: 0; }
  h3 { font-size: 16px; margin: 16px 0 8px; }
  p { margin: 0 0 8px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .intro { position: relative; margin-bottom: 56px; }   /* above the header's colour fade, which runs under it */
  .intro p { margin: 0; }
  /* The opening text under the title: one font, size, weight, line height and colour throughout, with 16px
     between the three short lines and the explanation. */
  .intro .qs { margin: 0 0 16px; }
  .intro .q, .intro .body { font-size: 18px; line-height: 24px; font-weight: 400; color: var(--ink); margin: 0; }

  /* Reveals: things arrive one after another (--d is set per element by JS), and below the fold as you scroll. */
  .motion .intro .explain, .motion main > details.panel, .motion footer {
    transition: opacity .7s ease var(--d, 0ms), translate .8s cubic-bezier(.2, .8, .2, 1) var(--d, 0ms); }
  .motion .intro .explain:not(.in),
  .motion main > details.panel:not(.in), .motion footer:not(.in) { opacity: 0; translate: 0 12px; }
  .motion .in { opacity: 1; translate: 0 0; }

  /* Opening sequence (see <head>). --write is set by JS to the writing duration. */
  .intro-anim h1 .tq:not(.written) { visibility: hidden; }
  .intro-anim h1 .tq .ch { opacity: 0; animation: ink .28s ease-out forwards; }
  @keyframes ink { to { opacity: 1; } }
  .intro-anim h1 .ta { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) calc(var(--write, 1200ms) + 800ms) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  .intro .explain { margin: 0 0 40px; }
  /* The title fonts only have Hebrew and Latin letters. Arabic, Russian and Amharic fall back to wider, taller
     fonts: they need more line height (Arabic marks would touch the line above), and fitLine() steps them down. */
  :lang(ar) h1 .ta, :lang(ru) h1 .ta, :lang(am) h1 .ta { line-height: 136px; margin-top: 0; }
  h1 .tq { text-wrap: balance; }
  @media (min-width: 600px) {
    h1, .intro { text-align: center; }
    h1 .tq { font-size: 56px; line-height: 64px; }
    h1 .ta { font-size: 144px; line-height: 136px; }
    :lang(ar) h1 .ta, :lang(ru) h1 .ta, :lang(am) h1 .ta { line-height: 176px; }
  }

  /* Icons: inline SVG masks, so they take the text color and survive text changes. */
  [data-icon]::before { content: ""; display: inline-block; flex: none; width: 20px; height: 20px; vertical-align: -4px;
                        background: currentColor; -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  [data-icon]:not(:empty)::before { margin-inline-end: 8px; }
  [dir="rtl"] [data-icon="skip"]::before, [dir="rtl"] [data-icon="send"]::before { transform: scaleX(-1); }
  [data-icon="send"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 2 11 13'/><path d='M22 2 15 22l-4-9-9-4z'/></svg>"); }
  [data-icon="check"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='m8 12 3 3 5-6'/></svg>"); }
  [data-icon="copy"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='9' y='9' width='12' height='12' rx='2'/><path d='M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1'/></svg>"); }
  [data-icon="lock"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='4' y='11' width='16' height='10' rx='2'/><path d='M8 11V7a4 4 0 0 1 8 0v4'/></svg>"); }
  [data-icon="alert"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3 2 21h20z'/><path d='M12 10v5M12 18h.01'/></svg>"); }
  [data-icon="calendar"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='5' width='18' height='16' rx='2'/><path d='M3 10h18M8 3v4M16 3v4'/></svg>"); }
  [data-icon="chat"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z'/><path d='M9.5 8.5c0 3.3 2.7 6 6 6l.5-2-2-.8-.8.8a4 4 0 0 1-1.7-1.7l.8-.8-.8-2z'/></svg>"); }
  [data-icon="mail"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='5' width='18' height='14' rx='2'/><path d='m3 7 9 6 9-6'/></svg>"); }
  [data-icon="skip"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m5 5 9 7-9 7z'/><path d='M19 5v14'/></svg>"); }
  [data-icon="speaker"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M11 5 6 9H3v6h3l5 4z'/><path d='M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13'/></svg>"); }
  [data-icon="globe"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z'/></svg>"); }
  [data-icon="stop"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='6' y='6' width='12' height='12' rx='1'/></svg>"); }
  [data-icon="megaphone"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 11v2a1 1 0 0 0 1 1h3l8 5V5L7 10H4a1 1 0 0 0-1 1z'/><path d='M19 9a4 4 0 0 1 0 6'/></svg>"); }
  [data-icon="sun"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5'/></svg>"); }
  [data-icon="moon"] { --icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z'/></svg>"); }
  :root { --alert-icon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3 2 21h20z'/><path d='M12 10v5M12 18h.01'/></svg>"); }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
  .langs { position: relative; }
  #lang-btn { color: var(--accent); border-color: var(--accent); }
  .lang-menu { position: absolute; top: 48px; inset-inline-start: 0; z-index: 10; min-width: 160px; margin: 0; padding: 8px;
               list-style: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
               box-shadow: 0 8px 24px rgb(0 0 0 / .2); }
  .lang-menu button { width: 100%; min-height: 40px; justify-content: flex-start; border: none; background: none; }
  .lang-menu button[aria-current="true"] { color: var(--accent); font-weight: 600; }
  .tools { display: flex; gap: 8px; }
  .logo-mark { display: block; height: 48px; width: auto; color: var(--ink); }
  /* With motion, the pen loop is drawn on from nothing first; the rest of the page follows (see runIntro). */
  .motion .logo-mark .loop { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw-loop .9s cubic-bezier(.6, 0, .2, 1) forwards; }
  @keyframes draw-loop { to { stroke-dashoffset: 0; } }
  /* Opening illustration: a voter at the booth, buried in party messages. The bubbles pop in one after another. */
  .hero-art { display: block; width: calc(100% - 32px); max-width: 304px; height: auto; margin: 40px auto -16px; overflow: visible; }
  .intro-anim .hero-art .art-img { animation: art-in .5s ease-out .6s both; }
  @keyframes art-in { from { opacity: 0; transform: translateY(12px); } }
  .intro-anim .hero-art .bubble { transform-box: fill-box; transform-origin: center;
    animation: bubble-pop .45s cubic-bezier(.3, 1.6, .5, 1) calc(1000ms + var(--i) * 90ms) both; }
  @keyframes bubble-pop { from { opacity: 0; transform: scale(.4); } }

  .icon-btn { min-height: 40px; min-width: 40px; padding: 8px; border-radius: 24px; background: var(--card); color: var(--ink); }
  .icon-btn::before { margin: 0; }

  details.panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-top: 24px; }
  /* The letter panel stands out while closed: a marker-yellow tab. Open, it looks like the rest. */
  details.panel#p-letter:not([open]) { background: var(--letter-tab); border-color: var(--letter-tab); }
  details.panel#p-letter:not([open]) > summary, details.panel#p-letter:not([open]) > summary::after { color: var(--on-letter-tab); }
  details.panel > summary { list-style: none; cursor: pointer; padding: 16px; display: flex;
                            justify-content: space-between; align-items: center; gap: 16px; min-height: 56px; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::after { content: "▾"; color: var(--muted); }
  details.panel[open] > summary::after { content: "▴"; }
  .ptitle { font-weight: 600; font-size: 20px; line-height: 28px; }
  .psum { color: var(--muted); flex: 1; text-align: end; }
  .pbody { padding: 0 16px 16px; }

  .field { margin-top: 16px; }
  .field:first-of-type { margin-top: 0; }
  label { display: block; font-weight: 600; }
  .hint { font-weight: 400; color: var(--muted); }
  input[type=text] { width: 100%; min-height: 48px; padding: 8px 16px; margin-top: 8px; font: inherit; color: inherit;
                     background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  input[type=text]:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px; }
  .field.invalid input { border: 2px solid var(--error); background: var(--error-bg); }
  .field-error { color: var(--error); margin: 8px 0 0; display: flex; gap: 8px; }
  .field-error::before { content: ""; flex: none; width: 20px; height: 20px; margin-top: 2px; background: currentColor;
                         -webkit-mask: var(--alert-icon) center / contain no-repeat; mask: var(--alert-icon) center / contain no-repeat; }
  .field-error:empty { display: none; }
  .form-alert { color: var(--error); background: var(--error-bg); border-radius: 8px; padding: 8px 16px; display: flex; align-items: center; }

  button, a.btn { font: inherit; cursor: pointer; border-radius: 8px; min-height: 48px; padding: 8px 16px;
                  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
                  text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  button.primary, a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.outline, a.btn.outline { background: transparent; border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .sheet-actions { display: flex; flex-direction: column; gap: 8px; }
  .sheet-actions button { width: 100%; }
  a.btn.disabled { opacity: .5; pointer-events: none; }
  .linkish { background: none; border: none; padding: 0 8px; min-height: 40px; color: var(--accent); text-decoration: underline;
             display: inline-flex; align-items: center; }
  .block { width: 100%; margin-top: 16px; }

  .progress { font-weight: 600; margin: 16px 0 8px; }
  .bulk { border: 2px solid var(--accent); border-radius: 8px; padding: 16px; margin: 8px 0 16px; }
  .bulk .btn.primary { width: 100%; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .row-actions { flex-direction: column; align-items: flex-start; gap: 0; }
  .who > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
                   min-height: 40px; padding: 0 8px; font-weight: 600; color: var(--accent); }
  .who > summary::-webkit-details-marker { display: none; }
  .who > summary::after { content: "▾"; }
  .who[open] > summary::after { content: "▴"; }
  ul.lists { list-style: none; margin: 0; padding: 0; }
  ul.lists > li { padding: 16px 8px; border-top: 1px solid var(--line); }
  /* The list being worked on now: a lifted card with a blue outline; only its send button is filled. */
  ul.lists > li.next { background: var(--card); border: 2px solid var(--accent); border-radius: 12px;
                       box-shadow: 0 8px 24px rgb(0 56 184 / .10); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .row label { display: flex; align-items: center; gap: 8px; }
  .row input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); }
  .lname { font-weight: 600; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .logo { flex: none; display: inline-flex; align-items: center; height: 40px; padding: 4px 8px; border-radius: 8px;
          background: #FFFFFF; border: 1px solid var(--line); }
  .logo img { height: 32px; width: auto; max-width: 96px; object-fit: contain; }
  .status-sent { color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; }
  .recipients { color: var(--muted); margin: 8px 0 0; padding: 0; list-style: none; word-break: break-word; }
  .recipients li { padding: 4px 0; }

  pre.letter { white-space: pre-wrap; font: inherit; background: var(--bg); border: 1px solid var(--line);
               border-radius: 8px; padding: 16px; margin: 0; }
  pre.letter[dir="rtl"] { text-align: right; }
  .banner { border: 2px solid var(--error); }

  .label-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; }
  .label-row label { max-width: calc(100% - 32px); }   /* a long label wraps itself, the ? stays beside it */
  .tip-btn { min-height: 24px; width: 24px; padding: 0; border-radius: 24px; font-weight: 700; line-height: 16px;
             border-color: var(--accent); color: var(--accent); background: var(--card); }
  .tip { display: none; flex-basis: 100%; margin: 8px 0 0; padding: 8px 16px; border-radius: 8px; background: var(--ink); color: var(--bg); }
  .tip.open { display: block; }
  @media (hover: hover) { .tip-btn:hover ~ .tip, .tip-btn:focus-visible ~ .tip { display: block; } }
  footer { margin-top: 24px; }
  .footer-links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 16px; }
  .footer-links .linkish, .footer-links a { padding: 0; min-height: 40px; display: inline-flex; align-items: center; }
  /* Popups for the accessibility statement and the legal notice. */
  dialog.sheet { width: calc(100% - 32px); max-width: 560px; border: 0; border-radius: 16px; padding: 24px;
                 background: var(--card); color: var(--ink); box-shadow: 0 24px 64px rgb(11 27 58 / .3); }
  dialog.sheet::backdrop { background: rgb(11 22 48 / .5); }
  dialog.sheet p { margin: 0 0 16px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
  .sheet-close { font-size: 24px; line-height: 1; }

  footer .fine { margin-top: 24px; color: var(--fine); }
  .toast { position: fixed; inset: auto 16px 16px 16px; max-width: 688px; margin: 0 auto; padding: 16px;

           display: flex; flex-direction: column; gap: 4px; }
  .toast.cheer { background: var(--marker); color: var(--on-marker); }

  @keyframes pulse { 50% { transform: scaleY(1.5); } }
  @media (prefers-reduced-motion: reduce) { #meter-fill { transition: none; } .meter.pulse { animation: none; } }
</style>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const I18N = DATA.i18n;
const SITE_URL = 'https://nadavbh12.github.io/party-spam/';
const SOURCE_URL = 'https://github.com/nadavbh12/party-spam';
const REGISTRY_URL = 'https://www.gov.il/he/departments/dynamiccollectors/parties-db';
// Privacy Protection Authority Q&A on the use of voter-register data (17.09.2026). Question 6 states the right to
// demand in writing that a party delete the data it uses for direct mail: the section 17ו(ב) right.
const LAW_URL = 'https://www.gov.il/he/pages/elections_questions_and_answers_22';
// Google Form for suggestions and help requests. Empty = the contact line stays hidden.
const CONTACT_FORM_URL = '';
// Email for "write to us". Kept reversed, so it isn't a plain string in the page source. This keeps it out of casual
// scraping only: anyone who reads the script can still reverse it. Empty = no email button.
const CONTACT_MAIL_REVERSED = '';
const contactMail = () => [...CONTACT_MAIL_REVERSED].reverse().join('');
const PPA_EMAIL = 'ppa@justice.gov.il';
const DAY_MS = 24 * 60 * 60 * 1000;
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;

// ---- Storage: kept only in this browser. The ID number is deliberately never stored. ----
function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable: state lasts only this visit */ }
}
const sent = load('party-deletion-sent', {});           // party number -> ISO date the user confirmed sending
let pending = load('party-deletion-pending', null);     // {titles, source: 'row' | 'bulk'} awaiting "did it go out?"
const details = load('party-deletion-details', {});     // name, phone, address
const SAVED_FIELDS = ['f-name', 'f-phone', 'f-address'];

// ---- Language and theme ----
// Always opens in Hebrew: this is an Israeli election page, and a saved choice would leak to whoever uses the
// same browser next. A ?lang=xx link opens that language (reviewers, sharing into a language community).
function initialLang() {
  const fromLink = new URLSearchParams(location.search).get('lang');
  return fromLink && I18N.languages[fromLink] ? fromLink : 'he';
}
let lang = initialLang();
const t = (key, vars = {}) => I18N.ui[lang][key].replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);
const listName = title => (lang === 'he' ? title : I18N.lists[lang][title]);
const formatDate = iso => new Date(iso).toLocaleDateString(I18N.languages[lang].locale);
const today = () => new Date().toISOString().slice(0, 10);

// Until the user picks a theme, follow the phone's clock: light from 07:00 to 18:59, dark from 19:00 to 06:59.
// (The same rule runs in <head> before first paint, so the page never flashes the wrong theme.)
const themeByClock = () => { const h = new Date().getHours(); return h >= 7 && h < 19 ? 'light' : 'dark'; };
function effectiveTheme() {
  return load('party-deletion-theme', null) || themeByClock();
}
function applyTheme() {
  document.documentElement.dataset.theme = effectiveTheme();
  const toLight = effectiveTheme() === 'dark';
  $('theme').dataset.icon = toLight ? 'sun' : 'moon';
  $('theme').setAttribute('aria-label', toLight ? t('themeToLight') : t('themeToDark'));
  $('theme').title = $('theme').getAttribute('aria-label');
}

// ---- Data ----
const UNITS = (() => {
  const byList = new Map(DATA.list_order.map(name => [name, []]));
  DATA.parties.forEach(p => byList.get(p.list).push(p));
  return [...byList].map(([title, parties]) => {
    const emails = [];
    parties.forEach(p => p.emails.forEach(e => {
      if (!emails.some(x => x.toLowerCase() === e.toLowerCase())) emails.push(e);
    }));
    return { title, parties, emails };
  });
})();
const isSent = unit => unit.parties.some(p => sent[p.number]);
const sentDate = unit => unit.parties.map(p => sent[p.number]).find(Boolean);
const remaining = () => UNITS.filter(u => u.emails.length && !isSent(u));
const unitsByTitle = titles => UNITS.filter(u => titles.includes(u.title));

// ---- Form and validation ----
const value = id => $(id).value.trim();
const formValues = () => ({ name: value('f-name'), id: value('f-id'), phone: value('f-phone') });
const touched = new Set();
const FIELD_INPUT = { name: 'f-name', id: 'f-id', phone: 'f-phone' };

function renderErrors(showAll) {
  const errors = validateForm(formValues());
  for (const field of Object.keys(FIELD_INPUT)) {
    const key = (showAll || touched.has(field)) ? errors[field] : null;
    // "ID or phone" is one error about two fields: mark both, explain once under the phone.
    const markedById = field === 'id' && errors.phone === 'idOrPhone' && (showAll || touched.has('phone'));
    $(`fld-${field}`).classList.toggle('invalid', Boolean(key || markedById));
    $(FIELD_INPUT[field]).setAttribute('aria-invalid', String(Boolean(key || markedById)));
    $(`err-${field}`).textContent = key ? t(key) : '';
  }
  if (!Object.keys(errors).length) $('form-alert').hidden = true;
  return errors;
}

// Checks the form before any send; on failure opens the form, marks every problem and focuses the first.
function requireValidForm() {
  const errors = renderErrors(true);
  const first = Object.keys(FIELD_INPUT).find(f => errors[f]);
  if (!first) return true;
  $('p-form').open = true;
  $('form-alert').textContent = t('fixBelow');
  $('form-alert').hidden = false;
  $(FIELD_INPUT[first]).focus();
  $('fld-' + first).scrollIntoView({ behavior: 'smooth', block: 'center' });
  return false;
}

// ---- Letters (always sent in Hebrew; other languages are shown for understanding only) ----
function letterText(letterLang, parties) {
  const L = I18N.letter[letterLang];
  const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);
  const name = value('f-name') || L.placeholderName;
  // Short party name plus registration number, on one line: the number is the legal identifier
  // and keeps the mailto link short enough for mail clients that truncate long links.
  const lines = [
    L.to,
    parties.length ? parties.map(p => fill(L.partyLine, { name: p.short_name, number: p.number })).join(', ') : '_'.repeat(24),
    '', L.re, '',
    fill(L.intro, { name, idPart: value('f-id') ? fill(L.idPart, { id: value('f-id') }) : '' }),
    L.demand, ...L.items, '', L.also, L.ask, '', L.identify,
  ];
  if (value('f-phone')) lines.push(fill(L.phone, { phone: value('f-phone') }));
  if (value('f-address')) lines.push(fill(L.address, { address: value('f-address') }));
  lines.push('', L.regards, name);
  return lines.join('\n');
}
const SUBJECT = I18N.letter.he.subject;
const partiesOf = units => units.flatMap(u => u.parties);
const emailsOf = units => [...new Set(units.flatMap(u => u.emails))];
const mailtoUrl = units => `mailto:${emailsOf(units).join(',')}?subject=${enc(SUBJECT)}&body=${enc(letterText('he', partiesOf(units)))}`;
const gmailUrl = units => `https://mail.google.com/mail/?view=cm&fs=1&to=${enc(emailsOf(units).join(','))}&su=${enc(SUBJECT)}&body=${enc(letterText('he', partiesOf(units)))}`;

// ---- Sending ----
function setPending(units, source) {
  pending = { titles: units.map(u => u.title), source };
  save('party-deletion-pending', pending);
  render();
}

function markSent(units) {
  units.forEach(u => u.parties.forEach(p => { sent[p.number] = today(); }));
  save('party-deletion-sent', sent);
}

function clearPending() {
  pending = null;
  save('party-deletion-pending', null);
}

function confirmPending(didSend) {
  if (didSend) markSent(unitsByTitle(pending.titles));
  clearPending();
  render();
  if (didSend) celebrate();
}

function el(tag, props = {}, children = []) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

// Sending goes through up to two popups, each asked once per visit: with an empty form, one explains that the
// email opens with blanks to fill in; then the user picks how to send (mail app, Gmail, or copy the letter).
// Details that were typed in must be valid. `onStarted` runs just before the email opens.
let sendMethod = null;        // 'app' | 'gmail' | 'copy'
let blanksAccepted = false;
const formEmpty = () => ['f-name', 'f-id', 'f-phone', 'f-address'].every(id => !value(id));

function startSend(units, source, onStarted = () => {}) {
  if (!units.length) return;
  if (!formEmpty() && !requireValidForm()) return;
  if (formEmpty() && !blanksAccepted) {
    askDialog('dlg-blanks', choice => {
      if (choice === 'fill') return openForm();
      blanksAccepted = true;
      startSend(units, source, onStarted);
    });
    return;
  }
  if (!sendMethod) {
    askDialog('dlg-method', choice => { sendMethod = choice; startSend(units, source, onStarted); });
    return;
  }
  onStarted();
  deliver(units, source, sendMethod);
}

function deliver(units, source, method) {
  if (method === 'copy') {
    const text = `${emailsOf(units).join(', ')}\n${SUBJECT}\n\n${letterText('he', partiesOf(units))}`;
    navigator.clipboard?.writeText(text).then(() => showToast(undefined, t('copiedAll'))).catch(() => {});
  } else {
    if (method === 'gmail') window.open(gmailUrl(units), '_blank', 'noopener');
    else location.href = mailtoUrl(units);
    copySafetyNet(units);
  }
  setTimeout(() => setPending(units, source), 0);
}

function openForm() {
  $('p-form').open = true;
  $('f-name').focus();
  $('fld-name').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// A popup with choice buttons (data-choice); the callback gets the chosen value. ×, Esc or outside: nothing.
let dialogChoice = null;
function askDialog(id, onChoice) {
  dialogChoice = onChoice;
  $(id).showModal();
}

function withIcon(node, name) {
  node.dataset.icon = name;
  return node;
}

function sendButton(text, units, source, { primary = false, outline = false } = {}) {
  const b = el('button', { type: 'button', className: primary ? 'primary' : outline ? 'outline' : 'linkish', textContent: text });
  if (primary || outline) withIcon(b, 'send');
  b.addEventListener('click', () => startSend(units, source));
  return b;
}

// Windows hands mailto links to desktop mail apps (Outlook and the like) through a ~2,000-character
// limit and cuts the rest silently. The letter is longer than that, so on Windows the send popup offers
// Gmail and copy only, never the desktop mail app. Phones and Macs have no such limit.
const PREFER_GMAIL = /Windows/i.test(navigator.userAgent);

// Some mail clients cut long mailto links. Copy the full letter on every send, so a cut or empty
// email can be fixed with one paste. Silent when the clipboard is unavailable.
function copySafetyNet(units) {
  navigator.clipboard?.writeText(letterText('he', partiesOf(units)))
    .then(() => showToast(undefined, t('copiedSafety')))
    .catch(() => {});
}

let toastTimer;
// main: the big line (a cheer); sub: a small note. Passing undefined keeps the line that is showing,
// so a cheer and the clipboard note from the next email can share one toast.
function showToast(main, sub, cheer = false) {
  const visible = !$('toast').hidden;
  if (main !== undefined || !visible) $('toast-main').textContent = main || '';
  if (sub !== undefined || !visible) $('toast-sub').textContent = sub || '';
  if (main !== undefined) $('toast').classList.toggle('cheer', cheer);
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, 8000);
}

// Positive feedback after every confirmed email, and a bigger one when every list is done.
function celebrate() {
  const total = UNITS.filter(u => u.emails.length).length;
  const count = UNITS.filter(isSent).length;
  const cheers = I18N.ui[lang].cheers;
  showToast(count >= total ? t('cheersDone') : `${cheers[(count - 1) % cheers.length]} (${count}/${total})`, '', true);
  const meter = document.querySelector('.meter');
  meter.classList.remove('pulse');
  void meter.offsetWidth;   // restart the animation
  meter.classList.add('pulse');
}

function confirmBox(question) {
  const yes = el('button', { type: 'button', className: 'primary', textContent: t('yes') });
  const no = el('button', { type: 'button', textContent: t('notYet') });
  yes.addEventListener('click', () => confirmPending(true));
  no.addEventListener('click', () => confirmPending(false));
  return el('div', { className: 'actions' }, [el('span', { textContent: question }), yes, no]);
}

let choosing = false;
let chosen = new Set();

// The sequence: each list still gets its own email, but the user moves through them with one tap
// per step. "Yes, next" marks the current list sent and opens the next email in the same tap.
let queue = load('party-deletion-queue', null);   // {titles, i}
function saveQueue() { save('party-deletion-queue', queue); }
const queueUnit = i => UNITS.find(u => u.title === queue.titles[i]);

// The main button of the sequence.
function primaryButton(text) {
  return withIcon(el('button', { type: 'button', className: 'primary block', textContent: text }), 'send');
}

function startQueue(units) {
  startSend([units[0]], 'queue', () => {
    queue = { titles: units.map(u => u.title), i: 0 };
    choosing = false;
    saveQueue();
  });
}

function endQueue() {
  queue = null;
  saveQueue();
  clearPending();
  render();
}

function advanceQueue(markCurrent) {
  const current = queueUnit(queue.i);
  if (markCurrent) { markSent([current]); celebrate(); }
  queue.i += 1;
  saveQueue();
  startSend([queueUnit(queue.i)], 'queue');
}

function renderQueueStep(box) {
  const n = queue.titles.length;
  const current = queueUnit(queue.i);
  const next = queue.i + 1 < n ? queueUnit(queue.i + 1) : null;
  const opened = pending?.source === 'queue';
  const parts = [
    el('p', { className: 'progress', textContent: t('queueStep', { i: queue.i + 1, n, list: listName(current.title) }) }),
  ];
  if (!opened) {
    parts.push(sendButton(t('queueOpen'), [current], 'queue', { primary: true }));
  } else {
    parts.push(el('p', { className: 'muted', textContent: t('queueHint') }));
    if (next) {
      const yes = primaryButton(t('queueYesNext', { list: listName(next.title) }));
      yes.addEventListener('click', () => advanceQueue(true));
      parts.push(yes);
    } else {
      const done = withIcon(el('button', { type: 'button', className: 'primary block', textContent: t('queueYesDone') }), 'check');
      done.addEventListener('click', () => { markSent([current]); endQueue(); celebrate(); });
      parts.push(done);
    }
  }
  const extra = [];
  if (opened) extra.push(sendButton(t('queueReopen'), [current], 'queue'));
  if (next) {
    const skip = withIcon(el('button', { type: 'button', className: 'linkish', textContent: t('queueSkip') }), 'skip');
    skip.addEventListener('click', () => advanceQueue(false));
    extra.push(skip);
  }
  const stop = withIcon(el('button', { type: 'button', className: 'linkish', textContent: t('queueStop') }), 'stop');
  stop.addEventListener('click', endQueue);
  extra.push(stop);
  parts.push(el('div', { className: 'actions' }, extra));
  box.replaceChildren(...parts);
}

function renderBulk() {
  const box = $('bulk');
  const left = remaining();
  if (queue) {
    renderQueueStep(box);
  } else if (!left.length) {
    box.replaceChildren();
  } else if (choosing) {
    const picked = left.filter(u => chosen.has(u.title));
    const start = primaryButton(t('queueStartChosen', { n: picked.length }));
    start.disabled = !picked.length;
    start.addEventListener('click', () => startQueue(picked));
    const cancel = el('button', { type: 'button', className: 'linkish', textContent: t('cancelChoose') });
    cancel.addEventListener('click', () => { choosing = false; render(); });
    box.replaceChildren(start, el('div', { className: 'actions' }, [cancel]));
  } else {
    const all = left.length === UNITS.filter(u => u.emails.length).length;
    const start = primaryButton(all ? t('queueStart') : t('queueStartRemaining', { n: left.length }));
    start.addEventListener('click', () => startQueue(left));
    const choose = el('button', { type: 'button', className: 'linkish', textContent: t('choose') });
    choose.addEventListener('click', () => { choosing = true; chosen = new Set(left.map(u => u.title)); render(); });
    box.replaceChildren(start, el('div', { className: 'actions' }, [choose]));
  }
}

function unitRow(unit, isNext) {
  const li = el('li', { className: isNext ? 'next' : '' });
  // Logo on a white tile (logos are drawn for light backgrounds), only for lists with a free text logo.
  const logo = DATA.list_logos[unit.title];
  const nameEl = el('span', { className: 'lname' }, [logo
    ? el('span', { className: 'logo' }, [el('img', { src: logo, alt: listName(unit.title), loading: 'lazy' })])
    : el('span', { textContent: listName(unit.title) })]);
  const head = el('div', { className: 'row' });
  const actions = el('div', { className: 'actions row-actions' });

  if (choosing && !isSent(unit)) {
    const box = el('input', { type: 'checkbox', checked: chosen.has(unit.title) });
    box.addEventListener('change', () => { box.checked ? chosen.add(unit.title) : chosen.delete(unit.title); render(); });
    head.append(el('label', {}, [box, nameEl]));
  } else {
    head.append(nameEl);
  }

  if (isSent(unit)) {
    head.append(withIcon(el('span', { className: 'status-sent', textContent: t('sentOn', { date: formatDate(sentDate(unit)) }) }), 'check'));
  } else if (pending?.source === 'row' && pending.titles.includes(unit.title)) {
    actions.append(confirmBox(t('confirmQ')));
  } else if (!choosing && !queue && unit.emails.length) {
    head.append(sendButton(t('send'), [unit], 'row', { primary: isNext, outline: !isNext }));
  }

  const recipients = el('ul', { className: 'recipients' }, unit.parties.map(p => el('li', {
    textContent: p.emails.length
      ? `${p.name}: ${p.emails.join(', ')}` + (p.note_key ? ` (${t(p.note_key)})` : '')
      : `${p.name}: ${t('regMail')}, ${p.address || t('noAddress')}`,
  })));
  actions.append(el('details', { className: 'who' }, [el('summary', { textContent: t('whoGetsIt') }), recipients]));

  li.append(head, actions);
  return li;
}

// ---- After sending ----
function overdueUnits() {
  return UNITS.filter(u => isSent(u) && Date.now() - new Date(sentDate(u)).getTime() >= 30 * DAY_MS);
}

function complaintMailto(units) {
  const name = value('f-name');
  const body = [
    'לכבוד הרשות להגנת הפרטיות,', '',
    `שמי ${name}${value('f-id') ? `, ת"ז ${value('f-id')}` : ''}.`,
    'פניתי בכתב למפלגות הבאות בדרישה למחוק את המידע האישי שלי ממאגרי המידע שלהן, לפי סעיף 17ו לחוק הגנת הפרטיות, התשמ"א-1981, ולא קיבלתי אישור על המחיקה בתוך 30 יום:',
    ...units.map(u => `- ${u.parties.map(p => `${p.name} (${p.number})`).join(', ')}: פנייה מ-${new Date(sentDate(u)).toLocaleDateString('he-IL')}`),
    '', 'הפניות המקוריות מצורפות.',
    'אבקש שהרשות תבדוק את הטיפול בבקשתי ותורה על מחיקת המידע.',

function calendarFile() {
  const first = UNITS.filter(isSent).map(sentDate).sort()[0];
  const due = new Date(new Date(first).getTime() + 30 * DAY_MS).toISOString().slice(0, 10).replaceAll('-', '');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//party-spam//HE', 'BEGIN:VEVENT',
    `UID:party-spam-${first}@nadavbh12.github.io`, `DTSTAMP:${due}T090000Z`,
    `DTSTART;VALUE=DATE:${due}`, `SUMMARY:${t('icsSummary')}`,
    `DESCRIPTION:${t('icsDescription')} ${SITE_URL}`,
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  return URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
}

// A translated bubble may be longer than the Hebrew one: widen its bubble around the text, kept inside the picture.
function fitBubbles() {
  document.querySelectorAll('.hero-art .bubble').forEach(bubble => {
    const text = bubble.querySelector('text');
    const rect = bubble.querySelector('rect');
    if (!rect.dataset.w) Object.assign(rect.dataset, { x: rect.getAttribute('x'), w: rect.getAttribute('width'), cx: text.getAttribute('x') });
    const cx = Number(rect.dataset.cx);
    const width = Math.max(Number(rect.dataset.w), text.getComputedTextLength() + 24);
    const x = Math.min(Math.max(cx - width / 2, 0), 360 - width);
    rect.setAttribute('width', width);
    rect.setAttribute('x', x);
    text.setAttribute('x', x + width / 2);
  });
}

// Footer links open the accessibility statement and the legal notice as popups; × , Esc or a click outside closes.
document.querySelectorAll('[data-dialog]').forEach(b => b.addEventListener('click', () => $(b.dataset.dialog).showModal()));
document.querySelectorAll('dialog.sheet').forEach(d => {

  $('id-why').setAttribute('aria-label', t('idWhy'));

  const [before, after] = t('footer', { date: '{date}', registry: '\u0000' }).split('\u0000');

function render() {

// ---- Read aloud: the browser's built-in speech, no server. Hidden when the device has no voice for the language. ----
const speech = window.speechSynthesis;
function voiceFor(code) {
  if (!speech) return null;
  const prefixes = code === 'he' ? ['he', 'iw'] : [code];   // some Android voices still report Hebrew as "iw"
  return speech.getVoices().find(v => prefixes.some(p => v.lang.toLowerCase().startsWith(p))) || null;
}
function readAloudText() {
  const parts = ['title', 'introQ', 'introMaybe', 'introNo', 'introBody'].map(k => t(k, { law: t('lawRef') }));
  parts.push(queue ? $('bulk').innerText : t('afterSendNote'));
  return parts.join('\n');
}
function updateReadButton() {
  $('read').hidden = !voiceFor(lang);
  const label = speech?.speaking ? t('stopReading') : t('readAloud');
  $('read').dataset.icon = speech?.speaking ? 'stop' : 'speaker';
  $('read').setAttribute('aria-label', label);
  $('read').title = label;
}
$('read').addEventListener('click', () => {
  if (speech.speaking) { speech.cancel(); updateReadButton(); return; }
  const utterance = new SpeechSynthesisUtterance(readAloudText());
  utterance.voice = voiceFor(lang);
  utterance.lang = utterance.voice.lang;
  utterance.onend = updateReadButton;
  utterance.onerror = updateReadButton;
  speech.speak(utterance);
  updateReadButton();
});
speech?.addEventListener?.('voiceschanged', updateReadButton);

// Smooth open/close for every collapsible (sections and "who gets it"). Delegated, so it also covers rows
// that render() rebuilds. Animates the height of the element; the content below moves with it.
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)');
document.addEventListener('click', ev => {
  const summary = ev.target.closest('summary');
  const details = summary?.parentElement;
  if (!details || details.tagName !== 'DETAILS' || REDUCED_MOTION.matches || details.dataset.animating) return;
  ev.preventDefault();
  details.dataset.animating = '1';
  const wasOpen = details.open;
  const borders = details.offsetHeight - details.clientHeight;
  const closed = summary.offsetHeight + borders;
  if (!wasOpen) details.open = true;   // open first, so the full height can be measured
  const full = details.offsetHeight;
  details.style.overflow = 'hidden';
  const anim = details.animate({ height: wasOpen ? [`${full}px`, `${closed}px`] : [`${closed}px`, `${full}px`] },
                               { duration: 280, easing: 'cubic-bezier(.2, .8, .2, 1)' });
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    anim.cancel();
    if (wasOpen) details.open = false;
    details.style.overflow = '';
    delete details.dataset.animating;
  };
  anim.onfinish = finish;
  // Animations (and their finish events) pause in background tabs; never leave a section stuck half-open.
  setTimeout(finish, 400);
});

// The title answer is designed as one line (two for the question). Where a language's words are
// longer, step the size down by 4px, keeping the line-height ratio, until it fits or reaches `min`.
// Returns whether it fits.
function fitLine(node, min, maxLines = 1) {
  node.style.fontSize = node.style.lineHeight = '';
  const cs = getComputedStyle(node);
  let size = parseFloat(cs.fontSize);
  const ratio = parseFloat(cs.lineHeight) / size;
  const lines = () => lineCount(node);
  while (size > min && lines() > maxLines) {
    size -= 4;
    node.style.fontSize = `${size}px`;
    node.style.lineHeight = `${Math.round((size * ratio) / 4) * 4}px`;
  }
  return lines() <= maxLines;
}
// Counts rendered lines from the text's own boxes; dividing the height by the line-height miscounts fallback
// fonts (Amharic) whose letters are taller than the line.
function lineCount(node) {
  const range = document.createRange();
  range.selectNodeContents(node);
  const tops = Array.from(range.getClientRects(), r => r.top).sort((a, b) => a - b);
  const gap = parseFloat(getComputedStyle(node).fontSize) * 0.4;
  return tops.filter((top, i) => i === 0 || top - tops[i - 1] > gap).length;
}
// For text that must stay on one line: shrink until the text itself fits the column.
function fitOneLine(node, min) {
  node.style.fontSize = node.style.lineHeight = '';
  const cs = getComputedStyle(node);
  let size = parseFloat(cs.fontSize);
  const ratio = parseFloat(cs.lineHeight) / size;
  const room = node.parentElement.clientWidth - 16;
  const range = document.createRange();
  range.selectNodeContents(node);
  while (size > min && range.getBoundingClientRect().width > room) {
    size -= 4;
    node.style.fontSize = `${size}px`;
    node.style.lineHeight = `${Math.round((size * ratio) / 4) * 4}px`;
  }
}
function fitTitle() {
  fitLine(document.querySelector('h1 .tq'), 32, 2);
  fitOneLine(document.querySelector('h1 .ta'), 48);
}
fitTitle();
document.fonts?.ready.then(() => { fitTitle(); fitBubbles(); });
addEventListener('resize', fitTitle);

// Returns how long the title sequence takes (writing, pause, answer pop), so reveals can start after it.
function runIntro() {
  const tq = document.querySelector('h1 .tq');
  const letters = Array.from(tq.textContent);
  const step = 40;   // ms per letter
  const lead = 1900; // first the logo loop, the illustration and the bubbles
  tq.replaceChildren(...letters.map((ch, i) =>
    ch === ' ' ? document.createTextNode(' ') : el('span', { className: 'ch', textContent: ch, style: `animation-delay:${lead + i * step}ms` })));
  tq.classList.add('written');
  const write = lead + letters.length * step;
  document.documentElement.style.setProperty('--write', `${write}ms`);
  save('party-deletion-seen', true);
  return write + 800 + 500;   // lead-in and writing, then a 0.8s pause, then the 0.5s answer pop
}
const titleTime = document.documentElement.classList.contains('intro-anim') ? runIntro() : 0;

// After the title, everything arrives one after another, each part when it scrolls into view. What is already
// on screen waits for the title sequence to finish; the rest waits for the scroll.
const revealTargets = document.querySelectorAll('.intro .explain, main > details.panel, footer');
if (document.documentElement.classList.contains('motion') && 'IntersectionObserver' in window) {
  let base = titleTime;
  const io = new IntersectionObserver(entries => {
    entries.filter(e => e.isIntersecting).forEach((e, i) => {
      e.target.style.setProperty('--d', `${base + i * 160}ms`);
      e.target.classList.add('in');
      io.unobserve(e.target);
    });
    base = 0;
  }, { threshold: 0.1 });
  revealTargets.forEach(node => io.observe(node));
} else {
  revealTargets.forEach(node => node.classList.add('in'));
}

</script>
