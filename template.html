<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מחיקה ממאגרי המפלגות</title>
<meta name="description" content="דרישה מהמפלגות למחוק את הפרטים שלכם ממאגרי המידע. מייל מוכן לכל רשימה, בלי שרת.">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:url" content="https://nadavbh12.github.io/party-spam/">
<meta property="og:title" content="מחיקה ממאגרי המפלגות">
<meta property="og:description" content="דרישה מהמפלגות למחוק את הפרטים שלכם ממאגרי המידע. מייל מוכן לכל רשימה, בלי שרת.">
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e2e0d8;
    --accent: #1f5f8b; --on-accent: #ffffff; --ok: #2e7d4f; --highlight: #fff6dc;
    --error: #b3261e; --error-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #33322e;
      --accent: #6fb0de; --on-accent: #10202c; --ok: #6cc08f; --highlight: #2c2817;
      --error: #f2a097; --error-bg: #3a1f1c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #33322e;
    --accent: #6fb0de; --on-accent: #10202c; --ok: #6cc08f; --highlight: #2c2817;
    --error: #f2a097; --error-bg: #3a1f1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Ethiopic", Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 64px; }
  h1 { font-size: 1.5rem; line-height: 1.33; margin: 16px 0 8px; }
  h2 { font-size: 1.125rem; margin: 0; }
  h3 { font-size: 1rem; margin: 16px 0 8px; }
  p { margin: 0 0 8px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: .875rem; }
  .intro p { margin: 0; }
  .intro .punch { font-size: 1.25rem; font-weight: 800; color: var(--accent); margin: 8px 0; }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .langs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .langs .globe { color: var(--accent); flex: none; }
  .langs button { min-height: 40px; padding: 8px 12px; border-radius: 24px; background: var(--card);
                  border-color: var(--accent); color: var(--accent); font-size: .875rem; }
  .langs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .icon-btn { min-height: 40px; min-width: 40px; padding: 8px; border-radius: 24px; background: var(--card); font-size: 1rem; }

  details.panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-top: 16px; }
  details.panel > summary { list-style: none; cursor: pointer; padding: 16px; display: flex;
                            justify-content: space-between; align-items: center; gap: 16px; min-height: 56px; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::after { content: "▾"; color: var(--muted); }
  details.panel[open] > summary::after { content: "▴"; }
  .ptitle { font-weight: 700; font-size: 1.125rem; }
  .psum { color: var(--muted); font-size: .875rem; flex: 1; text-align: end; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .pbody { padding: 0 16px 16px; }

  .field { margin-top: 16px; }
  .field:first-of-type { margin-top: 0; }
  label { display: block; font-weight: 600; }
  .hint { font-weight: 400; color: var(--muted); font-size: .875rem; }
  input[type=text] { width: 100%; min-height: 48px; padding: 8px 16px; margin-top: 8px; font: inherit; color: inherit;
                     background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .field.invalid input { border-color: var(--error); background: var(--error-bg); }
  .field-error { color: var(--error); font-size: .875rem; margin: 8px 0 0; }
  .field-error:empty { display: none; }
  .form-alert { color: var(--error); background: var(--error-bg); border-radius: 8px; padding: 8px 16px; }

  button, a.btn { font: inherit; cursor: pointer; border-radius: 8px; min-height: 48px; padding: 8px 16px;
                  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
                  text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  button.primary, a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  a.btn.disabled { opacity: .5; pointer-events: none; }
  .linkish { background: none; border: none; padding: 0 8px; min-height: 40px; color: var(--accent);
             text-decoration: underline; font-size: .875rem; }
  .block { width: 100%; margin-top: 16px; }

  .progress { font-weight: 600; margin: 16px 0 8px; }
  .bulk { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin: 8px 0 16px; }
  .bulk .btn.primary { width: 100%; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  ul.lists { list-style: none; margin: 0; padding: 0; }
  ul.lists > li { padding: 16px 8px; border-top: 1px solid var(--line); }
  ul.lists > li.next { background: var(--highlight); border-radius: 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .row label { display: flex; align-items: center; gap: 8px; }
  .row input[type=checkbox] { width: 24px; height: 24px; }
  .lname { font-weight: 600; }
  .status-sent { color: var(--ok); font-weight: 600; }
  .recipients { color: var(--muted); font-size: .875rem; margin: 8px 0 0; padding: 0; list-style: none; word-break: break-word; }
  .recipients li { padding: 4px 0; }

  pre.letter { white-space: pre-wrap; font: inherit; background: var(--bg); border: 1px solid var(--line);
               border-radius: 8px; padding: 16px; margin: 0; }
  pre.letter[dir="rtl"] { text-align: right; }
  .banner { border-color: var(--error); }

  .label-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; }
  .tip-btn { min-height: 24px; width: 24px; padding: 0; border-radius: 24px; font-size: .875rem; font-weight: 700;
             border-color: var(--accent); color: var(--accent); background: var(--card); }
  .tip { display: none; flex-basis: 100%; margin: 8px 0 0; padding: 8px 16px; border-radius: 8px;
         background: var(--ink); color: var(--bg); font-size: .875rem; }
  .tip.open { display: block; }
  @media (hover: hover) { .tip-btn:hover ~ .tip, .tip-btn:focus-visible ~ .tip { display: block; } }
  footer { margin-top: 24px; }
  .toast { position: fixed; inset: auto 16px 16px 16px; max-width: 688px; margin: 0 auto; padding: 16px;
           border-radius: 8px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgb(0 0 0 / .2);
           display: flex; flex-direction: column; gap: 4px; }
  .toast.cheer { background: var(--ok); color: #fff; }
  #toast-main:empty, #toast-sub:empty { display: none; }
  #toast-sub { font-size: .875rem; }
  .meter { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; margin-bottom: 16px; }
  #meter-fill { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 8px; transition: width .4s ease; }
  .meter.pulse { animation: pulse .6s ease; }
  @keyframes pulse { 50% { transform: scaleY(1.75); } }
  @media (prefers-reduced-motion: reduce) { #meter-fill { transition: none; } .meter.pulse { animation: none; } }
</style>
</head>

<main>
  <div class="topbar">
    <nav class="langs" id="langs" aria-label="שפה / Language">
      <svg class="globe" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/>
      </svg>
    </nav>
    <button type="button" class="icon-btn" id="theme"></button>
  </div>

  <details class="panel banner" id="p-overdue" open hidden>
    <summary><span class="ptitle" data-t="overdueTitle"></span></summary>
    <div class="pbody">

      <p class="muted" data-t="overdueAttach"></p>
      <a class="btn primary" id="complaint-mail" href="#" data-t="complaint"></a>

  <h1 data-t="title"></h1>
  <div class="intro">

    <p data-t="introMaybe"></p>

    <p data-t="introBody"></p>
  </div>

  <details class="panel" id="p-form">
    <summary><span class="ptitle" data-t="formTitle"></span><span class="psum" id="form-summary"></span></summary>
    <div class="pbody">
      <p class="form-alert" id="form-alert" role="alert" hidden></p>
      <div class="field" id="fld-name">
        <label for="f-name" data-t="nameLabel"></label>
        <input type="text" id="f-name" autocomplete="name" aria-describedby="err-name">
        <p class="field-error" id="err-name"></p>
      </div>
      <div class="field" id="fld-id">
        <div class="label-row">
          <label for="f-id" data-t="idLabel"></label>
          <button type="button" class="tip-btn" id="id-why" aria-expanded="false" aria-controls="id-tip">?</button>
          <p class="tip" id="id-tip" role="tooltip" data-t="idTip"></p>
        </div>
        <input type="text" id="f-id" inputmode="numeric" autocomplete="off" aria-describedby="err-id">
        <p class="field-error" id="err-id"></p>
      </div>
      <div class="field" id="fld-phone">
        <label for="f-phone"><span data-t="phoneLabel"></span> <span class="hint" data-t="phoneHint"></span></label>
        <input type="text" id="f-phone" inputmode="tel" autocomplete="tel" aria-describedby="err-phone">
        <p class="field-error" id="err-phone"></p>

      <div class="field" id="fld-address">

      </div>
      <p class="muted" style="margin-top:16px" data-t="savedNote"></p>
      <button type="button" class="primary block" id="continue" data-t="continue"></button>

  </details>

  <details class="panel" id="p-lists">
    <summary><span class="ptitle" data-t="listsTitle"></span><span class="psum" id="lists-summary"></span></summary>
    <div class="pbody">
      <p class="muted" data-t="orderNote"></p>
      <p class="muted" data-t="afterSendNote"></p>
      <p class="progress" id="progress"></p>
      <div class="meter" aria-hidden="true"><span id="meter-fill"></span></div>
      <div class="bulk">
        <div id="bulk"></div>
        <p class="muted" data-t="hebrewNote" data-not-he></p>
      </div>
      <ul class="lists" id="lists"></ul>
    </div>
  </details>

  <details class="panel" id="p-done" hidden>
    <summary><span class="ptitle" data-t="doneTitle"></span></summary>
    <div class="pbody">
      <p data-t="doneProof"></p>
      <p><span data-t="done30"></span>
        <a href="https://www.kolzchut.org.il/he/הסרת_פרטים_של_בעלי_זכות_בחירה_ממאגרי_המידע_של_המפלגות" target="_blank" rel="noopener" data-t="kolzchut"></a></p>
      <div class="actions">
        <button type="button" id="calendar" data-t="calendar"></button>
        <a class="btn" id="share" target="_blank" rel="noopener" data-t="share"></a>

  <details class="panel" id="p-letter">
    <summary><span class="ptitle" data-t="letterTitle"></span></summary>
    <div class="pbody">
      <p class="muted" data-t="hebrewNote" data-not-he></p>
      <h3 data-t="letterHebrew" data-not-he></h3>
      <pre class="letter" id="letter-he" dir="rtl" lang="he"></pre>
      <h3 data-t="letterTranslation" data-not-he></h3>
      <pre class="letter" id="letter-tr" data-not-he></pre>

  <footer class="muted" id="footer"></footer>
</main>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const I18N = DATA.i18n;
const SITE_URL = 'https://nadavbh12.github.io/party-spam/';
const SOURCE_URL = 'https://github.com/nadavbh12/party-spam';
const REGISTRY_URL = 'https://www.gov.il/he/departments/dynamiccollectors/parties-db';
const PPA_EMAIL = 'ppa@justice.gov.il';
const DAY_MS = 24 * 60 * 60 * 1000;
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;

// ---- Storage: kept only in this browser. The ID number is deliberately never stored. ----
function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable: state lasts only this visit */ }
}
const sent = load('party-deletion-sent', {});           // party number -> ISO date the user confirmed sending
let pending = load('party-deletion-pending', null);     // {titles, source: 'row' | 'bulk'} awaiting "did it go out?"
const details = load('party-deletion-details', {});     // name, phone, address
const SAVED_FIELDS = ['f-name', 'f-phone', 'f-address'];

// ---- Language and theme ----
// Hebrew unless the user picked another language: many Israelis run their phone in English.
function initialLang() {
  const saved = load('party-deletion-lang', null);
  return saved && I18N.languages[saved] ? saved : 'he';
}
let lang = initialLang();
const t = (key, vars = {}) => I18N.ui[lang][key].replace(/\{(\w+)\}/g, (_, k) => vars[k]);
const listName = title => (lang === 'he' ? title : I18N.lists[lang][title]);
const formatDate = iso => new Date(iso).toLocaleDateString(I18N.languages[lang].locale);
const today = () => new Date().toISOString().slice(0, 10);

function effectiveTheme() {
  return load('party-deletion-theme', null) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function applyTheme() {
  const stored = load('party-deletion-theme', null);
  if (stored) document.documentElement.dataset.theme = stored;
  else delete document.documentElement.dataset.theme;
  const toLight = effectiveTheme() === 'dark';
  $('theme').textContent = toLight ? '☀︎' : '☾';
  $('theme').setAttribute('aria-label', toLight ? t('themeToLight') : t('themeToDark'));
  $('theme').title = $('theme').getAttribute('aria-label');
}

// ---- Data ----
const UNITS = (() => {
  const byList = new Map(DATA.list_order.map(name => [name, []]));
  DATA.parties.forEach(p => byList.get(p.list).push(p));
  return [...byList].map(([title, parties]) => {
    const emails = [];
    parties.forEach(p => p.emails.forEach(e => {
      if (!emails.some(x => x.toLowerCase() === e.toLowerCase())) emails.push(e);
    }));
    return { title, parties, emails };
  });
})();
const isSent = unit => unit.parties.some(p => sent[p.number]);
const sentDate = unit => unit.parties.map(p => sent[p.number]).find(Boolean);
const remaining = () => UNITS.filter(u => u.emails.length && !isSent(u));
const unitsByTitle = titles => UNITS.filter(u => titles.includes(u.title));

// ---- Form and validation ----
const value = id => $(id).value.trim();
const formValues = () => ({ name: value('f-name'), id: value('f-id'), phone: value('f-phone') });
const touched = new Set();
const FIELD_INPUT = { name: 'f-name', id: 'f-id', phone: 'f-phone' };

function renderErrors(showAll) {
  const errors = validateForm(formValues());
  for (const field of Object.keys(FIELD_INPUT)) {
    const key = (showAll || touched.has(field)) ? errors[field] : null;
    // "ID or phone" is one error about two fields: mark both, explain once under the phone.
    const markedById = field === 'id' && errors.phone === 'idOrPhone' && (showAll || touched.has('phone'));
    $(`fld-${field}`).classList.toggle('invalid', Boolean(key || markedById));
    $(FIELD_INPUT[field]).setAttribute('aria-invalid', String(Boolean(key || markedById)));
    $(`err-${field}`).textContent = key ? t(key) : '';
  }
  if (!Object.keys(errors).length) $('form-alert').hidden = true;
  return errors;
}

// Checks the form before any send; on failure opens the form, marks every problem and focuses the first.
function requireValidForm() {
  const errors = renderErrors(true);
  const first = Object.keys(FIELD_INPUT).find(f => errors[f]);
  if (!first) return true;
  $('p-form').open = true;
  $('form-alert').textContent = t('fixBelow');
  $('form-alert').hidden = false;
  $(FIELD_INPUT[first]).focus();
  $('fld-' + first).scrollIntoView({ behavior: 'smooth', block: 'center' });
  return false;
}

// ---- Letters (always sent in Hebrew; other languages are shown for understanding only) ----
function letterText(letterLang, parties) {
  const L = I18N.letter[letterLang];
  const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);
  const name = value('f-name') || L.placeholderName;
  // Short party name plus registration number, on one line: the number is the legal identifier
  // and keeps the mailto link short enough for mail clients that truncate long links.
  const lines = [
    L.to,
    parties.map(p => fill(L.partyLine, { name: p.short_name, number: p.number })).join(', '),
    '', L.re, '',
    fill(L.intro, { name, idPart: value('f-id') ? fill(L.idPart, { id: value('f-id') }) : '' }),
    L.demand, ...L.items, '', L.also, L.ask, '', L.identify,
  ];
  if (value('f-phone')) lines.push(fill(L.phone, { phone: value('f-phone') }));
  if (value('f-address')) lines.push(fill(L.address, { address: value('f-address') }));
  lines.push('', L.regards, name);
  return lines.join('\n');
}
const SUBJECT = I18N.letter.he.subject;
const partiesOf = units => units.flatMap(u => u.parties);
const emailsOf = units => [...new Set(units.flatMap(u => u.emails))];
const mailtoUrl = units => `mailto:${emailsOf(units).join(',')}?subject=${enc(SUBJECT)}&body=${enc(letterText('he', partiesOf(units)))}`;
const gmailUrl = units => `https://mail.google.com/mail/?view=cm&fs=1&to=${enc(emailsOf(units).join(','))}&su=${enc(SUBJECT)}&body=${enc(letterText('he', partiesOf(units)))}`;

// ---- Sending ----
function setPending(units, source) {
  pending = { titles: units.map(u => u.title), source };
  save('party-deletion-pending', pending);
  render();
}

function markSent(units) {
  units.forEach(u => u.parties.forEach(p => { sent[p.number] = today(); }));
  save('party-deletion-sent', sent);
}

function clearPending() {
  pending = null;
  save('party-deletion-pending', null);
}

function confirmPending(didSend) {
  if (didSend) markSent(unitsByTitle(pending.titles));
  clearPending();
  render();
  if (didSend) celebrate();
}

function el(tag, props = {}, children = []) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

// Opens the email for `units` from a click on link `a`. Validates first and builds the URL at click
// time, so it always carries the latest details. Returns false when the send did not start.
function openSend(ev, a, units, source, gmail = false) {
  if (!units.length || !requireValidForm()) { ev.preventDefault(); return false; }
  a.href = gmail ? gmailUrl(units) : mailtoUrl(units);
  copySafetyNet(units);
  setTimeout(() => setPending(units, source), 0);
  return true;
}

function sendLink(text, units, source, { primary = false, gmail = false } = {}) {
  const a = el('a', { className: primary ? 'btn primary' : 'linkish', textContent: text, href: '#' });
  if (gmail) { a.target = '_blank'; a.rel = 'noopener'; }
  a.addEventListener('click', ev => openSend(ev, a, units, source, gmail));
  return a;
}

// Windows hands mailto links to desktop mail apps (Outlook and the like) through a ~2,000-character
// limit and cuts the rest silently. The letter is longer than that, so on Windows the page offers
// Gmail and copy only, never the desktop mail app. Phones and Macs have no such limit.
const PREFER_GMAIL = /Windows/i.test(navigator.userAgent);

// Some mail clients cut long mailto links. Copy the full letter on every send, so a cut or empty
// email can be fixed with one paste. Silent when the clipboard is unavailable.
function copySafetyNet(units) {
  navigator.clipboard?.writeText(letterText('he', partiesOf(units)))
    .then(() => showToast(undefined, t('copiedSafety')))
    .catch(() => {});
}

let toastTimer;
// main: the big line (a cheer); sub: a small note. Passing undefined keeps the line that is showing,
// so a cheer and the clipboard note from the next email can share one toast.
function showToast(main, sub, cheer = false) {
  const visible = !$('toast').hidden;
  if (main !== undefined || !visible) $('toast-main').textContent = main || '';
  if (sub !== undefined || !visible) $('toast-sub').textContent = sub || '';
  if (main !== undefined) $('toast').classList.toggle('cheer', cheer);
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, 8000);
}

// Positive feedback after every confirmed email, and a bigger one when every list is done.
function celebrate() {
  const total = UNITS.filter(u => u.emails.length).length;
  const count = UNITS.filter(isSent).length;
  const cheers = I18N.ui[lang].cheers;
  showToast(count >= total ? t('cheersDone') : `${cheers[(count - 1) % cheers.length]} (${count}/${total})`, '', true);
  const meter = document.querySelector('.meter');
  meter.classList.remove('pulse');
  void meter.offsetWidth;   // restart the animation
  meter.classList.add('pulse');
}

function copyButton(units) {
  const b = el('button', { type: 'button', className: 'linkish', textContent: t('copy') });
  b.addEventListener('click', async () => {
    if (!units.length || !requireValidForm()) return;
    const text = `${emailsOf(units).join(', ')}\n${SUBJECT}\n\n${letterText('he', partiesOf(units))}`;
    try { await navigator.clipboard.writeText(text); b.textContent = t('copied'); }
    catch (e) { b.textContent = t('copyFailed'); }
  });
  return b;
}

function confirmBox(question) {
  const yes = el('button', { type: 'button', className: 'primary', textContent: t('yes') });
  const no = el('button', { type: 'button', textContent: t('notYet') });
  yes.addEventListener('click', () => confirmPending(true));
  no.addEventListener('click', () => confirmPending(false));
  return el('div', { className: 'actions' }, [el('span', { textContent: question }), yes, no]);
}

let choosing = false;
let chosen = new Set();

// The sequence: each list still gets its own email, but the user moves through them with one tap
// per step. "Yes, next" marks the current list sent and opens the next email in the same tap.
let queue = load('party-deletion-queue', null);   // {titles, i}
function saveQueue() { save('party-deletion-queue', queue); }
const queueUnit = i => UNITS.find(u => u.title === queue.titles[i]);

// The main button of the sequence: mail app, or Gmail in a new tab on Windows.
function primaryAnchor(text) {
  const a = el('a', { className: 'btn primary', href: '#', textContent: text });
  if (PREFER_GMAIL) { a.target = '_blank'; a.rel = 'noopener'; }
  return a;
}

function startQueue(ev, a, units) {
  queue = { titles: units.map(u => u.title), i: 0 };
  if (!openSend(ev, a, [units[0]], 'queue', PREFER_GMAIL)) { queue = null; return; }
  choosing = false;
  saveQueue();
}

function endQueue() {
  queue = null;
  saveQueue();
  clearPending();
  render();
}

function advanceQueue(ev, a, markCurrent) {
  const current = queueUnit(queue.i);
  if (markCurrent) { markSent([current]); celebrate(); }
  queue.i += 1;
  saveQueue();
  openSend(ev, a, [queueUnit(queue.i)], 'queue', PREFER_GMAIL);
}

function renderQueueStep(box) {
  const n = queue.titles.length;
  const current = queueUnit(queue.i);
  const next = queue.i + 1 < n ? queueUnit(queue.i + 1) : null;
  const opened = pending?.source === 'queue';
  const parts = [
    el('p', { className: 'progress', textContent: t('queueStep', { i: queue.i + 1, n, list: listName(current.title) }) }),
  ];
  if (!opened) {
    parts.push(sendLink(t('queueOpen'), [current], 'queue', { primary: true, gmail: PREFER_GMAIL }));
  } else {
    parts.push(el('p', { className: 'muted', textContent: t('queueHint') }));
    if (next) {
      const yes = primaryAnchor(t('queueYesNext', { list: listName(next.title) }));
      yes.addEventListener('click', ev => advanceQueue(ev, yes, true));
      parts.push(yes);
    } else {
      const done = el('button', { type: 'button', className: 'primary block', textContent: t('queueYesDone') });
      done.addEventListener('click', () => { markSent([current]); endQueue(); celebrate(); });
      parts.push(done);
    }
  }
  const extra = PREFER_GMAIL ? [] : [sendLink(t('gmail'), [current], 'queue', { gmail: true })];
  if (opened) extra.push(sendLink(t('queueReopen'), [current], 'queue', { gmail: PREFER_GMAIL }));
  if (next) {
    const skip = el('a', { className: 'linkish', href: '#', textContent: t('queueSkip') });
    skip.addEventListener('click', ev => advanceQueue(ev, skip, false));
    extra.push(skip);
  }
  const stop = el('button', { type: 'button', className: 'linkish', textContent: t('queueStop') });
  stop.addEventListener('click', endQueue);
  extra.push(stop);
  parts.push(el('div', { className: 'actions' }, extra));
  box.replaceChildren(...parts);
}

function renderBulk() {
  const box = $('bulk');
  const left = remaining();
  if (queue) {
    renderQueueStep(box);
  } else if (!left.length) {
    box.replaceChildren();
  } else if (choosing) {
    const picked = left.filter(u => chosen.has(u.title));
    const start = primaryAnchor(t('queueStartChosen', { n: picked.length }));
    if (!picked.length) start.classList.add('disabled');
    start.addEventListener('click', ev => startQueue(ev, start, picked));
    const cancel = el('button', { type: 'button', className: 'linkish', textContent: t('cancelChoose') });
    cancel.addEventListener('click', () => { choosing = false; render(); });
    box.replaceChildren(start, el('div', { className: 'actions' }, [cancel]));
  } else {
    const all = left.length === UNITS.filter(u => u.emails.length).length;
    const start = primaryAnchor(all ? t('queueStart') : t('queueStartRemaining', { n: left.length }));
    start.addEventListener('click', ev => startQueue(ev, start, left));
    const choose = el('button', { type: 'button', className: 'linkish', textContent: t('choose') });
    choose.addEventListener('click', () => { choosing = true; chosen = new Set(left.map(u => u.title)); render(); });
    box.replaceChildren(start, el('div', { className: 'actions' }, [choose]));
  }
}

function unitRow(unit, isNext) {
  const li = el('li', { className: isNext ? 'next' : '' });
  const nameEl = el('span', { className: 'lname', textContent: listName(unit.title) });
  const head = el('div', { className: 'row' });
  const actions = el('div', { className: 'actions' });

  if (choosing && !isSent(unit)) {
    const box = el('input', { type: 'checkbox', checked: chosen.has(unit.title) });
    box.addEventListener('change', () => { box.checked ? chosen.add(unit.title) : chosen.delete(unit.title); render(); });
    head.append(el('label', {}, [box, nameEl]));
  } else {
    head.append(nameEl);
  }

  if (isSent(unit)) {
    head.append(el('span', { className: 'status-sent', textContent: t('sentOn', { date: formatDate(sentDate(unit)) }) }));
  } else if (pending?.source === 'row' && pending.titles.includes(unit.title)) {
    actions.append(confirmBox(t('confirmQ')));
  } else if (!choosing && !queue && unit.emails.length) {
    head.append(sendLink(PREFER_GMAIL ? t('gmailPrimary') : t('send'), [unit], 'row', { primary: true, gmail: PREFER_GMAIL }));
    if (!PREFER_GMAIL) actions.append(sendLink(t('gmail'), [unit], 'row', { gmail: true }));
    actions.append(copyButton([unit]));
  }

  const recipients = el('ul', { className: 'recipients' }, unit.parties.map(p => el('li', {
    textContent: p.emails.length
      ? `${p.name}: ${p.emails.join(', ')}` + (p.note_key ? ` (${t(p.note_key)})` : '')
      : `${p.name}: ${t('regMail')}, ${p.address || t('noAddress')}`,
  })));
  actions.append(el('details', {}, [el('summary', { className: 'linkish', textContent: t('whoGetsIt') }), recipients]));

  li.append(head, actions);
  return li;
}

// ---- After sending ----
function overdueUnits() {
  return UNITS.filter(u => isSent(u) && Date.now() - new Date(sentDate(u)).getTime() >= 30 * DAY_MS);
}

function complaintMailto(units) {
  const name = value('f-name');
  const body = [
    'לכבוד הרשות להגנת הפרטיות,', '',
    `שמי ${name}${value('f-id') ? `, ת"ז ${value('f-id')}` : ''}.`,
    'פניתי בכתב למפלגות הבאות בדרישה למחוק את המידע האישי שלי ממאגרי המידע שלהן, לפי סעיף 17ו לחוק הגנת הפרטיות, התשמ"א-1981, ולא קיבלתי אישור על המחיקה בתוך 30 יום:',
    ...units.map(u => `- ${u.parties.map(p => `${p.name} (${p.number})`).join(', ')}: פנייה מ-${new Date(sentDate(u)).toLocaleDateString('he-IL')}`),
    '', 'הפניות המקוריות מצורפות.',
    'אבקש שהרשות תבדוק את הטיפול בבקשתי ותורה על מחיקת המידע.',
    '', 'בכבוד רב,', name,
  ].join('\n');
  return `mailto:${PPA_EMAIL}?subject=${enc('תלונה: מפלגות לא מחקו את פרטיי ממאגרי המידע')}&body=${enc(body)}`;
}

function calendarFile() {
  const first = UNITS.filter(isSent).map(sentDate).sort()[0];
  const due = new Date(new Date(first).getTime() + 30 * DAY_MS).toISOString().slice(0, 10).replaceAll('-', '');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//party-spam//HE', 'BEGIN:VEVENT',
    `UID:party-spam-${first}@nadavbh12.github.io`, `DTSTAMP:${due}T090000Z`,
    `DTSTART;VALUE=DATE:${due}`, `SUMMARY:${t('icsSummary')}`,
    `DESCRIPTION:${t('icsDescription')} ${SITE_URL}`,
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  return URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
}

// ---- Rendering ----
function applyStaticText() {
  const meta = I18N.languages[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = meta.dir;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(node => { node.textContent = t(node.dataset.t); });
  document.querySelectorAll('[data-not-he]').forEach(node => { node.hidden = lang === 'he'; });
  $('id-why').setAttribute('aria-label', t('idWhy'));
  document.querySelectorAll('#langs button').forEach(b => b.setAttribute('aria-pressed', String(b.lang === lang)));
  const [before, after] = t('footer', { date: '{date}', registry: '\u0000' }).split('\u0000');
  $('footer').replaceChildren(
    before, el('a', { href: REGISTRY_URL, target: '_blank', rel: 'noopener', textContent: t('registry') }),
    after.replace('{date}', '{{SCRAPED_DATE}}'), ' ',
    el('a', { href: SOURCE_URL, target: '_blank', rel: 'noopener', textContent: t('source') }));
  $('share').href = `https://wa.me/?text=${enc(`${t('shareText')} ${SITE_URL}`)}`;
  applyTheme();
}

function render() {
  const firstOpen = queue ? queueUnit(queue.i) : choosing ? null : remaining()[0];
  $('lists').replaceChildren(...UNITS.map(u => unitRow(u, u === firstOpen)));
  const total = UNITS.filter(u => u.emails.length).length;
  const sentCount = UNITS.filter(isSent).length;
  $('progress').textContent = t('progress', { sent: sentCount, total });
  $('lists-summary').textContent = t('progress', { sent: sentCount, total });
  $('meter-fill').style.width = `${total ? (100 * sentCount) / total : 0}%`;
  renderBulk();

  const errors = validateForm(formValues());
  $('form-summary').textContent = Object.keys(errors).length ? '' : [value('f-name'), value('f-phone')].filter(Boolean).join(' · ');

  const preview = pending ? partiesOf(unitsByTitle(pending.titles)) : UNITS[0].parties;
  $('letter-he').textContent = letterText('he', preview);
  $('letter-tr').textContent = letterText(lang, preview);
  $('letter-tr').dir = I18N.languages[lang].dir;

  const doneWasHidden = $('p-done').hidden;
  $('p-done').hidden = !sentCount;
  if (doneWasHidden && sentCount) $('p-done').open = true;

  const overdue = overdueUnits();
  $('p-overdue').hidden = !overdue.length;
  if (overdue.length) $('overdue-text').textContent = t('overdueText', { lists: overdue.map(u => listName(u.title)).join(', ') });
}

// ---- Wiring ----
// Each language button is written in its own script, so a reader finds theirs without reading Hebrew.
Object.entries(I18N.languages).forEach(([code, meta]) => {
  const b = el('button', { type: 'button', lang: code, textContent: meta.name });
  b.addEventListener('click', () => {
    lang = code;
    save('party-deletion-lang', lang);
    applyStaticText();
    renderErrors(false);
    render();
  });
  $('langs').append(b);
});
$('theme').addEventListener('click', () => {
  save('party-deletion-theme', effectiveTheme() === 'dark' ? 'light' : 'dark');
  applyTheme();
});

SAVED_FIELDS.forEach(id => { $(id).value = details[id] || ''; });
['f-name', 'f-id', 'f-phone', 'f-address'].forEach(id => {
  $(id).addEventListener('input', () => {
    if (SAVED_FIELDS.includes(id)) { details[id] = value(id); save('party-deletion-details', details); }
    renderErrors(false);
    render();
  });
});
Object.entries(FIELD_INPUT).forEach(([field, id]) => $(id).addEventListener('blur', () => {
  if (value(id)) touched.add(field);
  renderErrors(false);
}));

$('continue').addEventListener('click', () => {
  if (!requireValidForm()) return;
  $('p-form').open = false;
  $('p-lists').open = true;
  $('p-lists').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('id-why').addEventListener('click', () => {
  const open = $('id-tip').classList.toggle('open');
  $('id-why').setAttribute('aria-expanded', String(open));
});
$('calendar').addEventListener('click', () => el('a', { href: calendarFile(), download: 'party-spam-reminder.ics' }).click());
$('complaint-mail').addEventListener('click', ev => {
  if (!requireValidForm()) { ev.preventDefault(); return; }
  ev.currentTarget.href = complaintMailto(overdueUnits());
});

// Open the form first; if saved details already make it valid, go straight to the lists.
const startValid = !Object.keys(validateForm(formValues())).length;
$('p-form').open = !startValid;
$('p-lists').open = startValid;
applyStaticText();
render();
</script>
</body>
</html>
